name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: check the tag matches gradle.properties
        run: test "v$(sed -n 's/^version=//p' gradle.properties)" = "${GITHUB_REF_NAME}"
      - run: ./gradlew --no-daemon publishAndReleaseToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
      - name: github release
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes $(case "${GITHUB_REF_NAME}" in *-*) echo --prerelease ;; esac) build/libs/*.jar
        env:
          GH_TOKEN: ${{ github.token }}
